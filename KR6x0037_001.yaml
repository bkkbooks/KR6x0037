body:
  text: 攝阿毗達磨義論歸命彼世尊應供等覺者一攝心分別一無比之等正覺者正法及無上之衆歸命敬禮我當説攝阿毗達磨義論其中阿毗達磨論於第一義言四種心心所色涅槃攝一切盡無餘二其中先述心是欲界色界無色界出世間之四種此中云何欲界一十二不善心一喜俱相應無行一心二喜俱惡見相應有行一心三喜俱惡見不相應無行一心四喜俱惡見不相應有行一心五捨俱惡見相應無行一心六捨俱惡見相應有行一心七捨俱惡見不相應無行一心八捨俱惡見不相應有行一心此等之八名為貪俱心九憂俱瞋恚相應無行一心一憂俱瞋恚相應有行一心此等之二名為瞋恚相應心一一捨俱疑相應一心一二捨俱掉舉相應一心此等之二稱為愚癡心三貪根有八種瞋根有二種癡根有二種為十二不善四二十八無因心一三有捨俱眼識同樣有捨俱一四耳識一五鼻識一六舌識一七有苦俱身識一八有捨俱領受心一九有捨俱推度心以上此等之七名為不善異熟心二有捨俱眼識同樣有捨俱二一耳識二二鼻識二三舌識二四有樂俱身識二五有捨俱領受心二六有喜俱推度心二七有捨俱推度心以上此等之八名為善異熟心二八有捨俱五門轉向心二九同樣有捨俱意門轉向心三有喜俱笑起心以上此等之三名為無因唯作心以上如斯十八皆稱為無因心五七不善異熟及善異熟之八種唯作心三之十八是無因心除惡與無因之三十心為五十九心又説九十一心是淨心六三二十四有因心三一喜俱智相應無行一心三二喜俱智相應有行一心三三喜俱智不相應無行一心三四喜俱智不相應有行一心三五捨俱智相應無行一心三六捨俱智相應有行一心三七捨俱智不相應無行一心三八捨俱智不相應有行一心以上此等之八名為欲界善心三九喜俱智相應無行一心四喜俱智不相應有行一心四一喜俱智不相應無行一心四二喜俱智不相應有行一心四三捨俱智相應無行一心四四捨俱智相應有行一心四五捨俱智不相應無行一心四六捨俱智不相應有行一心以上此等之八名為欲界有因異熟心四七喜俱智相應無行一心四八喜俱智相應有行一心四九喜智不相應無行一心五喜俱智不相應有行一心五一捨俱智相應無行一心五二捨俱智相應有行一心五三捨俱智不相應無行一心五四捨俱智不相應有行一心以上此等之八名為欲界有因唯作心以上如斯二十四皆稱為欲界有因之善異熟唯作心七由受智行之區別有二十四之有因欲界善異熟唯作於欲中二十三之異熟二十之善不善十一之唯作一切為五十四心八四十五色界心五五與尋伺喜樂一境性俱初禪善心五六與伺喜樂一境性俱第二禪善心五七與喜樂一境性俱第三禪善心五八與樂一境性俱第四禪善心五九與捨一境性俱第五禪善心以上此等之五名為色界善心六與尋伺喜樂一境性俱初禪異熟心六一與伺喜樂一境性俱第二禪異熟心六二與喜樂一境性俱第三禪異熟心六三與樂一境性俱第四禪異熟心六四與捨一境性俱第五禪異熟心以上此等之五名為色界異熟心六五與尋伺喜樂一境性俱初禪唯作心六六與伺喜樂一境性俱第二禪唯作心六七與喜樂一境性俱第三禪唯作心六八與樂一境性俱第四禪唯作心六九與捨一境性俱第五禪唯作心以上此等之五名為色界唯作心以上如斯十五皆稱為色界之善異熟唯作心九色界之意由禪之區別為五種更於喜異熟唯作之區別為十五種一五十二無色界心七空無邊處善心七一識無邊處善心七二無所有處善心七三非想非非想處善心以上此等之四名為無色界善心七四空無邊處異熟心七五識無邊處異熟心七六無所有處異熟心七七非想非非想處異熟心以上此等之四名為無色界異熟心七八空無邊處唯作心七九識無邊處唯作心八無所有處唯作心八一非想非非想處唯作心以上此等之四名為無色唯作心以上如斯十二皆稱為無色界之善異熟唯作心一一無色界之意由所緣之區別為四種更於善異熟唯作之區別而立十二種一二六八出世間心八二須陀洹道心八三斯陀含道心八四阿那含道心八五阿羅漢道心以上此等之四名為出世間善心八六須陀洹果心八七斯陀含果心八八阿那含果心八九阿羅漢果心以上此等之四名為出世間異熟心以上如斯之八皆稱為出世間之善異熟心一三由四道之區別而善為四種其果亦同樣故異熟亦四種此八種為無上出世間十二是不善善是二十一異熟三十六唯作心二十欲中五十四色中言十五無色十二心又無上八種如斯當知意區別八十九慧者又分別一百二十一一四七百二十一心云何八十九種心成為百二十一與尋伺喜樂一境性俱初禪須陀洹道心與伺喜樂一境性俱第二禪須陀洹道心與喜樂一境性俱第三禪須陀洹道心與樂一境性俱第四禪須陀洹道心與捨一境性俱第五禪須陀洹道心以上此等名為須陀洹道心斯陀含道心阿那含道心阿羅漢道心亦同樣為各五種如斯正有二十道心果心亦同樣為正二十如斯出世間心正為四十心世間心八十一共為一百二十一心一五由禪支相應之別而一一為五無上出世間心言為四十種如斯解色界無上亦如斯由初禪等之別無色是第五禪故初禪等之一一禪言各十一種然終之第五禪有二十三種善三十七種異熟五十二種故諸慧者説心一百二十一於此攝阿毗達磨義論名為攝心分別第一品二攝心所分別一同生及同滅同所緣與基所依心相應心所有五十二法二云何一五十二心所觸受想思一境性命根作意此等之七名為一切心心所尋伺勝解精進喜欲此等之六名為雜心所以上此等之十三當知同他同於他心所癡無慚無愧掉舉貪見慢瞋嫉慳惡作惛沈睡眠疑此等之十四名為不善心所信念慚愧無貪無瞋中捨身輕安心輕安身輕快性心輕快性身柔軟性心柔軟性身適業性心適業性身練達性心練達性身端直性心端直性此等之十九名為共淨心所正語正業正命之三名為離心所悲喜名為無量心所如斯共慧根當知此等一切二十五心所名為淨心所三以上十三之同他又十四之不善及二十五之淨説為五十二彼等心不離心所及生起八十九心各自之相應適宜以下説七心所於一切雜心所適合於相應十四唯不善心淨唯與淨心相應四二共一切心所及雜心所相應心云何先述共一切心之此等七心所得於一切八十九心中生起其次雜心所尋先除去二之前五識在欲界心及十一初禪心之五十五心中生起其次伺是彼等五十五心與十一之第二禪心之六十六心中生起勝解是除去二之五識及疑俱心之十一種心於諸七十八心中生起精進是除去五門轉向心及二之五識二領受心三推度心之十六心於諸七十三心中生起喜是除去二憂俱心五十五捨俱心二身識十一第四禪之七十心於諸五十一心中生起欲是除去十八無因心二癡心之二十心於諸六十九心中生起而與雜心所相應之彼等心生起之次第如下五六十六心與五十五十一心與十六心七十與二十心除去雜心所七十五與六十六心七十八與七十三心五十一與六十九心有俱雜心所之心六三不善心所相應心其次不善心所中癡無慚無愧掉舉此等之四名為共一切不善心所得於一切之十二不善心中生起貪唯得於八貪心中生起見是於四惡見相應心中生起慢是於四惡見不相應心中生起瞋嫉慳惡作之此等四心所是於二瞋恚相應中生起惛沈睡眠是於五有行心中生起疑是唯於疑俱心中生起七癡等四一切不善心中貪見慢之三是於貪根中生瞋嫉慳惡作之四是於瞋根心中又惛沈睡眠之二是在有行心中疑是在疑心中生如斯十四心所成為五種唯與十二不善心相應八四淨心所相應心其次於淨心所中先述共淨之十九心所是存在於一切五十九淨心中其次正語正業正命之三離皆於八出世間心中必決定一起得然於世間心唯在欲界八善心中而且其時三離有時各別存在生起其次悲喜之二無量除去第五禪唯十二之色界大心及欲界八善心欲界有因八唯作心之二十八心或有時多種別別而生又此處欲界之捨俱心有人言無悲喜其次慧與十二之智相應欲界心及一切三十五之大心出世間心與四十七心相應九共淨之十九法於五十九心中生説明三離於十六心中二無量於二十八心中慧是在四十七種心中生如斯淨為四種唯與淨心相應一嫉慳惡作三離悲喜等之九有時多種別別生慢及惛沈睡眠有時於各別有時而共生餘之四十一如所説決定相應起今我説彼等適宜相攝三十六在法無上出世間三十五在大上二界中三十八於欲界淨心中得二十七於不善心中十二在無因心中得此由發生地相應者其心所之攝為五種一一五出世間心相應心所云何先述於出世間八之初禪心中同他之十三心所除去二無量餘攝二十三淨心所共三十六法同樣於第二禪之八心除去尋攝三十五法第三禪之八心除去尋伺攝三十四法第四禪之八心除去尋伺喜攝三十三法第五禪之八心是捨俱同攝彼等三十三法一切八出世間心中之心所法由五種禪而為五種攝一二無上出世間之心所法如斯次第立五種為三十六三十五三十四三十三二種一三六與色無色界心相應心所其次於大上二界中先於善異熟唯作之三初禪心中同他十三心所除去三離攝二十二淨心所共三十五法而悲喜於此必各別相應同樣於第二禪心中除去尋攝三十四法於第三禪心中除去尋伺攝三十三法於第四禪心中除去尋伺喜攝三十二法於十五之第五禪心中更不得悲喜之二無量而攝三十法如斯一切二十七大心中之心所法依五種禪成為五種攝一四大心中之心所法如斯次第立五種為三十五三十四三十三又三十二及三十一五七欲界淨心相應心所其次欲界淨心先述善心中最初智相應之二心中同他之十三心所攝二十五淨心所之三十八法而二無量與三離之五於此各別相應同樣於第二之二心中除去智攝三十七法第三智相應之二心中除去喜攝三十七法第四之二心中除去智及喜而攝彼等三十六法在唯作心中亦除去三離同樣於四之二心中而攝四種同樣在異熟心中亦除去二無量及三離而攝其餘彼等心所四種如是一切二十四欲界淨心中之心所法如二心為攝十二種一六善淨中有三十八三十七二種及三十六唯作中有三十五三十四二種及三十三異熟中有三十三三十二二種及三十一言此為欲界有因之善異熟唯作心相應心所唯作與大上二界無有三離無上出世間與欲界異熟無有二無量無上禪法異中上二界禪法與無量於小欲界無量離智喜各異一七八不善心相應心所其次不善心先述貪根中之第一無行心同他之十三心所共不善之四心所之十七攝貪見共為十九法同樣於第二無行心攝貪慢共為十九法於第三無行心亦同樣除去喜與貪見共為十八法於第四之無行心同樣攝貪慢共為十八法其次五之瞋恚相應無行心與瞋嫉慳惡作之四皆除喜攝彼等二十法而嫉慳惡作於此各別相應五種之有行心亦與無行心同樣其不同者但有行心更與惛沈睡眠相應其次由同他之十三心除去欲喜十一之同他共不善四之十五法相應於掉舉俱心疑俱心除去勝解俱疑同得十五法如斯一切於十二不善心生起心所法十二心各別相應由相應心所法之數即攝七種一八於不善中立十九十八二十二十一二十二十二十五之七種共不善之四及同他十之此等十四言與一切不善心相應一九九無因心相應心所其次無因心中先述笑心由十三同他除去欲攝十二之同他法同樣於確定心除欲喜而攝十一法於樂俱領受心除去欲精進而攝十一法無因意界之三心及雙之結生意識界除去欲喜精進而攝十心所二之五識除去六之雜心所攝彼等七心所如斯一切無因心中之心所法若由數唯攝四種二十二十一十七之四種乃十八之無因心生起中攝於無因心之一切處有七心所餘適當而推知若如斯詳言心所法者言為攝三十二種已知是心不離心所法之相應與攝得舉示適宜依心相等心所法之差別於此攝阿毗達義論名為攝心所分別為第二品三攝雜分別一於適宜相應心與心所法彼等依自性成為五十三其等由一受二因三作用四門五所緣六基所依所攝者依心生起而適宜二其中先就一受之攝受是樂苦不苦不樂之三種又依樂苦喜憂捨之區別而為五種其中為樂俱唯善異熟身識之一同樣於苦俱唯不善異熟身識其次於喜俱心稱為貪根四欲界淨之十二樂俱推度心笑心二共十八之欲界喜俱心及初第二第三第四禪為四十四之大上二界出世間心為六十二種其次喜俱心唯二之瞋恚相應心餘之五十五唯捨俱心三其中受是苦樂捨之三種更由喜憂之差別而為五種樂苦各一處憂在二處喜有六十二處餘捨五十五處四二對於因之攝所謂因是貪瞋癡無貪無瞋無癡之六種其中五門轉向心二之前五識二領受心三推度心確定心笑心之十八心名為無因餘一切之七十一心是有因又其有因心之中二愚癡心是一因餘之十不善心智不相應欲界十二淨心之二十二心是二因智相應欲界十二淨心大出世間三十五心之四十七心是三因五貪瞋與愚癡是三不善因無貪瞋愚癡善因無記因無因為十八二是唯一因二十二二因四十七三因六三對於作用之攝所謂作用是結生有分轉向見聞嗅嘗觸領受推度確定速行彼所緣死之十四其次由結生有分轉向五識之處等彼等八十九心當知有十種處之差別其中捨俱之二推度心八之大異熟心九之色無色異熟心之十九心名為結生有分死之作用其次無因唯作之二心為轉向作用同樣於各二心為見聞嗅嘗觸領受之作用無因異熟之三心為推度作用意門轉向心唯於五門成為確定作用以上除世間異熟及二轉向唯作心其餘二十一善十二不善四聖果十八唯作之五十五心為遠作用八之大異熟心三之推度心之十一心為彼所緣作用其次其等八十九心之中捨俱之二推度心依結生有分死彼所緣推度名為五作用八之大異熟心依結生有分死彼所緣名為四作用九大上二界異熟心依結生有分死名為三作用喜俱之推度心依推度所緣為二作用確定心亦依確定轉向為二作用而其餘一切之速行心三種意界二之前五識之六十八心是隨於發生為一作用七結生等之別作用有十四若説處之別心生為十種六十八二九八二如次第説示作用處一二三四五八四對於門之攝所謂門是眼門耳門鼻門舌門身門意門之六種其中眼是眼門同樣耳等即是耳門等又轉向前之有分言為意門其中一五門轉向心二眼識二領受心三推度心一確定心二十九速行心八彼所緣心之四十六心於眼門適宜生起同樣於耳門等亦有一五門轉向心二耳識等之四十六心於五門右之一切五十四心唯欲界心其次於意門有一意門轉向心五十五速行心十一彼所緣心之六十七心依結生有分死之十九心是離開門其次其等八十九心中二之前五識大上二界出世間之二十六速行心之三十六心適宜於六門中一門之作用又三意識界是五門作用一樂俱推度心一確定心二十九欲界速行心之三十一心是六門作用二之捨俱推度心八之大異熟心者有六門作用亦在離門大上二界之九異熟心唯是離門九心生由一門五門及六門六門或離門及離一切門次第三十六三與三十一十種與九種説示五種類一五對於所緣之攝所謂所緣者是色所緣聲所緣香所緣味所緣觸所緣法所緣之六種其中色是色所緣同樣於聲等是聲所緣等其次法所緣是攝淨色細心心心所涅槃施設假法之六種其中一切眼門心唯色為所緣此等唯現在同樣於耳門心等唯聲等為所緣此等亦唯現在其次意門心之所緣為六種此適宜於現在過去未來離時稱為結生有分死之離門心之所緣為六種多於前過去有之末所把取六門之現在過去或稱為施設假法之業業相趣相者其等色等現在等業等為所緣諸心中眼識等如次唯色等一一為所緣其次三意界以色等之五為所緣其餘欲界異熟心與笑心唯以欲界一切為所緣不善心智不相應之欲界速行心除出世間其餘者一切為所緣智相應之欲界善心與稱為第五禪之神通善心除去阿羅漢道果其餘以一切為所緣智相應之欲界唯作心第五禪之唯作神通心確定心者以普遍一切為所緣無色中之第二心第四心以大上二界為所緣其餘之大上二界心以一切施設假法為所緣出世間心以涅槃為所緣一一二十五對於小欲界六心對於大上二界二十一對於言説施設八對於涅槃境為所緣二十除無上五除最上之道果六乃緣一切處如是其處攝七類一二六對於基所依之攝基是眼耳鼻舌身心基之六種其等一切於欲界中得其次於色界中無鼻舌身等三又於無色界一切皆不現其中五識界如次第專依止於眼耳鼻舌身之五淨基而轉起其次稱為五門轉向領受之意識界是依止於心基而轉起又其餘稱為意識界之推度心大異熟心瞋恚之二心初道心笑心色界心亦依止心基而轉起其次餘之善不善唯作無上出世間心或依止心基或不依止無色之異熟心不依止心基而轉起一三欲中之七識界依止於六基色中之四依止於三基無色中一意識界無所依四十三有依止四十二依止或不依止而生無色之異熟無依止此攝阿毗達磨義論名為攝雜分別第三品四攝路分別一如斯已説以上心生起之攝更於由地人之差別而決定前後之繼起於結生轉起説心活動之攝從其所生我略説二一六六法六基六門六所緣六識六路六種境之轉起此於路之攝當知為六六法其次於離路有業業相趣相之三種境轉起其中如前所説基門所緣此六識是眼識耳識鼻識舌識身識意識其次六路是門而為眼門路耳門路鼻門路舌門路身門路意門路又依識而為眼識路耳識路鼻識路舌識路身識路意識路依門活動當知與依心識活動有關連三二五門作用在眼耳鼻舌身之五門有極大大小極小之所緣其次於意門有明瞭不明瞭之所緣當知此是六種境之轉起云何由生住滅之三剎那名為一心剎那其次依斯心剎那之十七剎那為色法生滅之壽命經過一心剎那或經過心剎那以達住位五所緣來現於五門故若經過一心剎那色所緣現於眼之視界由此有分識二次活動後遮斷有分之流顧念注意喚起彼色所緣之五門轉向心一次生滅由此其後見其色之眼識領受之領受心推度之推度心確定之確定心如次第各一次生滅其後二十九之欲界速行心中得生起之緣最多行七次之速行又隨結速行之二剎那彼所緣異熟心適合轉起由此而墮於有分以上十四剎那路心之生起及二剎那有分之動搖前已過去以一心剎那色法使充足十七心剎那其後而滅此十七心剎那相續之所緣名為極大之境若現來所緣以不可能至彼所緣之生起而過去者此名為大之境其時速行完了立刻墮於有分即無有彼所緣之生起若所緣來入不可能至速行心生起而過去者此名為小境其時亦不起速行心唯二三次之確定心轉起然後墮於有分其次現來近於滅之所緣不可能至確定心之生起而過去者此名為極小境此時唯有有分之動搖而無路心之生起如斯於眼門為心作用於耳門等亦然如斯於一切五門當知稱為四種時分彼所緣時分速行時分確定時分空時分如次第為所緣境而轉起四路心有七種心生起有十四剎那詳言之五門適合於五十四心此於境轉起中之五門為路心轉起法五三欲界之意門作用其次於意門若明瞭之所緣現來識閾由此二剎那有分之動搖一剎那之意門轉向心七剎那之速行心之後二剎那之彼所緣異熟心轉起然後墮於有分其次有不明瞭之所緣時速行之立刻墮於有分即無彼所緣之生起六路心有三種心生起言為十剎那若詳細辨知此有四十一心此為境轉起中之小欲界速行時分七四上二界出世間之禪定作用其次述安止根本定速行時分於所緣無有明瞭不明瞭之差別又無有彼所緣之生起即其時八智相應欲界速行心中之隨一成為遍作近行隨順種姓者而四次或三次如次第生起而滅後適合於第四或第五速行而引發二十六之大界出世間速行心中隨一之速行心隨入於安止路由此安止之後而墮於有分其時喜俱欲界心之速行後亦當唯期望安止喜俱心捨俱欲界心之速行後當唯斯望捨俱心其時亦善速行欲界心之後安止於善速行及下三界心唯作速行欲界心之後安止於唯作速行及阿羅漢果心八依樂善有三十二安止心又捨善有十二安止心樂唯作有八安止心捨唯作六安止心生由欲善三因有凡夫有學之安止由三因欲唯作有離欲者之安止此於六門中之意門為路心轉起法九五彼所緣之決定其次於六門之一切處對於不好所緣各有不善異熟之前五識領受心推度心彼所緣心又對於好所緣各有善異熟之前五識領受心推度心彼所緣心又對於極好所緣唯有樂俱之推度心彼所緣心而已即於彼所緣心中喜俱唯作速行心之後唯有喜俱之彼所緣心於捨俱唯作速行心之後唯有捨俱之彼所緣心又憂俱速行心之後彼所緣及有分必是捨俱故若依喜俱心而結生者於彼憂俱速行之後即無彼所緣生其時曾經驗而緣任何彼小欲界所緣而生起捨俱之推度心其推度心之後墮於有分是諸阿闍梨之所説又彼阿闍梨於欲界速行心之後主張欲界有情唯欲界之諸法為所緣而有彼所緣一決定欲中有情之速行心之諸所緣時且明瞭極大所緣時言有彼所緣此是路心轉起中之彼所緣之決定一一六速行之決定速行之中在小欲界速行路之欲界速行心七次或六次速行其次於死時等之遲轉起唯有五時分速行而已但諸義疏師説於世尊雙示導神變等之速行起有四或五剎那之觀察速行心又於初習者之最初速行之營作即大界速行心神通速行心亦常唯於一時分一次速行然後墮於有分其次四聖道速行心之生起為一心剎那其後二三剎那之果心適合生起然後墮於有分在滅盡定之時第四無色之速行心二次速行然後證達滅定而由滅定出起時適合阿那含果心或阿羅漢果心一時分一次生滅已而墮有分如斯於一切處之等至禪定路如有分之流無決定路故有多數種之速行一二小欲界速行七次道與神通各為一其餘速行有多數此是路心轉起中速行之決定一三七路心由人之差別其次在此二因者無因者皆不得唯作速行及安止速行又善趣之二因者無因者有三因不得智相應異熟心之彼所緣在無因之惡趣有二因亦不得智不相應大異熟心之彼所緣其次於三因者中漏盡者不得善不善心之速行又在有學凡夫不得唯作心之速行有學不得惡見相應心疑心之速行又阿那含人不得瞋恚心之速行出世間心之速行唯適合聖者之生起一四無學四十四心有學五十六心餘者之凡夫所示發生五十四心此是路心轉起中由人而差別一五八路心由地之差別其次於欲界地適合得此等一切之八十路心於色界地除去瞋恚心之速行及彼所緣心等得六十四心於無色界地由此更除去初道心色界心下無色心等而得路心於一切處各各缺淨根者不得各各門之路心其次無想有情一切心之轉起一六在欲界中有八十路心於色界中適合六十四心於無色界中得四十二心此是路心轉起中由地而差別一七如是隨六門之心轉起之發生以渡越有分只限於要有命壽即不斷絶而活動於此攝阿毗達磨義論名為攝路分別第四品五攝離路分別一由路心之心活動如上所述今説結生之心活動之攝者二四地四種結生四業四種死之生起此於離路之攝當知為四之四法其中一四地是惡趣地欲善趣地色界地無色界地此名為四地其等四地中一惡趣地是地獄畜生界餓鬼界阿修羅衆此為四種二欲善趣地是人四王天三十三天夜摩天都率天樂變化天他化自在天此為七種而以上十一地亦稱為欲界地三梵衆天梵輔天大梵天此為初禪地少光天無量光天此是第二禪地少淨天無量淨天遍淨天此為第三禪地廣果天無想有情天淨居天此為第四禪地以上十六種是色界地淨居地是無煩天無熱天善現天善見天阿迦膩吒天之五種四空無邊處地識無邊處志地無所有處地非想非非想處地之四種此為無色界地三淨居天凡夫及須陀洹斯陀含人不得生聖者不生無想天及惡趣地其餘聖非聖所共得此是四之四法中為地之四法四二四種結生惡趣結生欲善趣結生色界結生無色界結生此為四種結生其中一不善異熟捨俱之推度心是轉生惡趣為剎那結生其後成為有分心有分之後成為死心而斷絶此名為一惡趣結生心其次二善異熟捨俱之推度心是於欲善趣甲生盲等之人人乙依止地者土地神及丙於墮處轉起阿修羅之結生心有分心死心其次大異熟之八心於欲善趣之一切處轉起結生心有分心死心此等之九心名為欲善趣結生心而以上十種稱為欲界結生心其中四惡趣人墮處阿修羅之壽量無有定數然四大王天之壽量依天之數為五百歲依人間之數為九百萬歲三十三天之壽量是四大王天之四倍夜摩天之壽量又增其四倍都率天之壽量又增其四倍樂變化天之壽量又增其四倍他化自在天之壽量又增其四倍五他化自在天之壽量以人間之數為九十二億一千萬年又六百萬歲六三初禪異熟心於初禪地轉起結生心有分心死心同樣於第二禪異熟心及第三禪異熟心者於第二禪地第四禪異熟心者於第三禪地第五禪異熟心是於第四禪地轉起結生心有分心死心然無想有情之結生唯是色同樣其結生後之轉起及於死時亦唯是色轉起而滅此等之六名為色界結生其等中梵衆天之壽量為三之一劫梵輔天之壽量為半劫大梵天之壽量為一劫少光天之壽量為二劫無量光天之壽量為四劫光音天之壽量為八劫少淨天之壽量為十六劫無量淨天之壽量為三十二劫遍淨天之壽量為六十四劫廣果天及無想有情之壽量為五百劫無煩天之壽量為千劫無熱天之壽量為二千劫善現天之壽量為四千劫善見天之壽量為八千劫阿迦膩吒天之壽量為一萬六千劫四初無色等之異熟心如次第於初無色等之地而轉起結生心有分心死心此等之四名為無色結生而於其等生於空無邊處天之壽量為二萬劫生於識無邊處天之壽量為四萬劫生於無所有處天之壽量為六萬劫生於非想非非想處天之壽量為八萬四千劫七結生有分心乃至死意位皆是為同一同境同一生此是四之四法中之結生四法八三四業今生業支持業妨害業破損業此由作用為四業重業近業宿習業已作業此依取異熟之異門為四業現法受業次生受業後後受業既有業此名依異熟時之四業又不善業欲界善業色界善業無色界善業此依異熟處為四業其中不善業是由身業語業意業之業門為三種何以故殺生不與取邪欲行此稱身表於身門數數行故名為身業妄語兩舌惡口綺語此稱語表於語門數數行故名為語業貪欲瞋恚邪見此不依表身語於意數數行故名為意業其等中由殺生惡口是由瞋根瞋恚而生邪欲行貪欲邪見是由貪根而生餘之不與取妄語兩舌綺語之四是由貪癡之二根而生而八十九心生起者此不善業共為十二種欲界善業亦於身門轉起為身業於語門轉起為語業於意門轉起為意業由如斯業門者欲界善業為三種又由施戒修之別亦為三種而八十九心生起者此欲界善業為八種若由財物之施持戒禪定之修長上之恭敬看病等之作務得福之施對得福無慳垢隨喜聽法説法離邪見見正直業即為十種而以上十二不善心八善心之二十種皆稱為欲界業其次色界善業唯是意業此是修所成而由安止根本定之所得若由禪之差別色界善業為五種同樣無色界善業是意業此亦是修所成而由安止根本定之所得由所緣之差別無色界善業為四種此諸業中十二不善業除去掉舉心而十一心於惡趣地生起結生然於轉起一切十二種七不善異熟心在欲界及色界之一切處適合於異熟欲界善心亦唯於欲界善趣生起結生然一切八善心於轉起八大異熟其中三因殊勝善心給與三因之結生於轉起使異熟十六異熟心三因之劣與二因殊勝之善心給與二因之結生於轉起除去三因使異熟十二異熟心其次二因之劣善心唯與無因之結生於轉起唯使異熟八無因異熟心九某人人宣説無行心不令熟有行異熟心有行心令熟無行異熟心若依彼等之説如次第有十二十八之異熟隨順其説從發生而舉示一其次色界善心若修初禪之小者生起於梵衆天若其中修者生起於梵輔天若修勝者生起大梵天同樣若修第二禪第三禪之小者於少光天若修中者於無量光天若修勝者生起於光音天若修第四禪之小者於少淨天若修中者於無量淨天若修勝者生起於遍淨天若修第五禪於廣果天若修其想之離者生起於無想有情天又阿那含是生起淨居天如次第修無色界善者生起於無色天中一一從如斯地轉起大上二界之福於結生轉起生其同界地之異熟此是四之四法業之四法一二四四種死及結生之次第由壽盡業盡兩者之盡由斷業而有四種死之生起又如是而死之人人一於近死之時適合業力現前於兩有之中間令生結生有與有之連結業又二曾其業之作時得為業資助色等之業相三生起之後當得有受用之趣相依業力而現起六門之隨一然後如斯現起緣彼業業相趣相等之所緣隨順於業以起異熟為遍淨又隨染之心相續隨順應得之有心相續傾向其處數數多轉起或唯業令生其結生使其新鮮而達於意門彼死之接近者於路心之終又於有分之滅盡由死為現在有之終了生起死心而滅其滅完了其後如斯緣所得之所緣無明隨眠所圍渴愛隨眠為根本之行而令生由相應之諸法而遍取令住於俱生之諸法以令連結其次之有而稱為結生之先行適合於有基或無基生起意住立於次之有一三其次於近死之路心於徐緩轉起所期望唯五速行若現在之色所緣現存於識閾時而死者結生有分之所緣亦應為現在如是由欲界結生而把取六門之業相及趣相而得現在過去所緣又業一心剎那相續故唯為過去所緣而把取於意門此等一切為小欲界法之所緣其次由色界結生唯施設假法之業相為所緣同樣於無色之結生亦唯大界上二界及施設之業相適合為所緣其次無想之有情僅以命九法為結生而存立故彼等無想有情名為依色之結生者無色有情為依非色之結生者其餘之有情是依色非色之結生者一四無色有情之死後除去不生下無色有結生於無色及結生欲界三因色界之死後除無因應有二因三因之結生由欲界三因死而有一切之結生由其他二因無因有結生於欲界此是四之四法中死結生之次第一五如斯取結生者由結生滅後以來緣同一所緣而同一心至死心生起止不生起路心時依有之分稱為有分相續而意無斷絶如河流之轉起而於最後由死成為死心而滅然後又生結生等如車輪如次第轉轉而轉起一六如斯於此世有結生有分路心死次更有結生有分等如斯轉轉心相續而省察此為不恆常得證無死句涅槃善務之慧者正實善正斷愛潤之結於此攝阿毗達磨義論名為離路分別第五品六攝色分別一以上有心心所法種種轉起之分別已分別者今當説明色關此色依列舉分別等起聚緣起之次第有五種之攝二一色之列舉四大種及四大種所造色此二種色攝十一種何以故一地界水界火界風界名為大種色二眼耳鼻舌身名為淨色三色聲香味及除水界稱三大種之觸名為境色四如性女根男性男根名為性色五心基名為心色六命根名為命色七段食名為食色以上此十八種色稱為自性色自相色完色色色思惟色八虛空界名為限界色九身表語表名為表色一色輕快性色柔軟性色適業性及身語之二表名為變化色一一色積集色相續色老性色無常性名為相色而於此生色由積集相續之名而説以上此十一種色由自性而成二十八種三何以故四大種五淨四境二性心及命食色為十八種限界二表三變化四相之十不完色而成二十八種四二色之分別其次此一切之色唯無因有緣有漏有為世間欲界無所緣非所緣故為一種又依內外等種種差別何以故一稱為淨者有五種名為內色其他為外色二稱五淨心基有六種名為基色其他為非基色三稱為淨表之七種名為門色其他為非門色四稱為淨性命之八種名為根色其他為非根色五七稱為淨境之十二種是粗色近色有對色其他是細色遠色無對色八業生色是執受色其他是非執受色九色處是有見色其他是無見色一眼等二是不到達境鼻等之三是到達境以上五種皆是取境色其他是不取境色一一色香味食素段食四大種之八種是不簡別色其他是簡別色五如斯二十八種色聰慧者宜分別內等三法之差別此是色攝中之色分別六三色之等起業心時節食名為四色等起其中一欲界色界之二十五種之善不善業所行作以取結生其剎那剎那於內相續而令等起業等起色二除無色之異熟心及二之前五識餘七十五種心亦含括最初之有分其等諸心生時令等起心等起色其中安止根本定速行心令起威儀確定心欲界速行心神通心是不僅威儀即表亦使等起又其中十三之善速行心亦令生笑三稱寒冷暑熱之火界達於住位必內外適合令等起時節等起色四稱食素之食咽下時達於住位而即令等起食等起色其中心色根色之九唯是業生二表唯是心生聲是心時節生輕快性柔軟性適業性等之三是由時節心食而生八種之不簡別色及虛空界是由業心時節食之四發生四種之相色不從任何而生七如次第十八十五十三十二是由業心時節食而生四種之相色單生業等色之自性故説不從任何而生此是色之攝中色等起法八四色聚一起一滅一所依俱行之二十一名為色聚其中命與八種之不簡別色與眼共言眼十法同樣命與八不簡別色之九共與身耳等組合如次第言耳十法鼻十法舌十法身十法女性十法男性十法基十法八不簡色與命共言命九法此等之眼十法乃至命九法之九為業等起聚其次八不簡別色是純八法其八法與身表共為身表九法八法是共語表及聲為語表十法八法是共輕快性柔軟性適業性等為軟快性等之十一法八法是共身表輕快性等為十二法八法是共語表聲輕快性等為十三法此純八法乃至十三法之六是心等起聚純八法聲九法輕快性等之十一法聲輕快性等之十二法此四是時節等起聚純八法聲九法輕快性等之十一法此二法是食等起聚其中純八法與聲九法此二之時節等起聚亦得於身體外其餘一切唯於內九業心時節食等起如次第九六四二而合為二十一聚諸聚之限界相故聰慧者虛空與四相不言為聚分此是色之攝中聚之結合一五轉起之次第其次此等一切不缺得適合於欲界之轉起其次於欲界之結生濕生者與化生者稱眼耳鼻舌身性基十法之七十法於最多時現前而最少時眼耳鼻性十法或時不得故其等之任何或全部滅而應知聚之數其次於胎生有情稱為身性基十法之三十法現前其處胎生有情亦於性十法時不得其後於轉起於次第眼十法等現前如斯結生以來有業等起色第二心以來有心等起色第二心之住時以來有時節等起色食素周遍於身體以來有食等起色如斯四等起色聚之相續於欲界如燈焰如河流如有壽之限內無斷絶而轉起而於死時死心以前第十七心之住時以後不生起業生色其以前生起業生色與死心同時轉起而滅其後心生食生之色斷絶其後時節等起色展轉稱為死尸而轉起一一如斯死之有情更於次之有結生以來同樣色轉起一二其次於色界中不得鼻舌身性十法及食生聚故彼等之結生時眼耳基之三十法與命九法得四之業等起聚於轉起得心時節等起之四聚其次於無想有情不得眼耳基聲又不得一切之心生色故彼等無想有情之結生時唯有命九法又轉起時除去聲存留時節等起色如斯當知稱為欲色無想依三處中之結生轉起是二種色之轉起一三一切二十八色在欲中二十三色在色中於無相有情唯十七色無色無何物於生起結生不得聲變化色老性死無常性然於轉起無有不得者此是色之攝中色轉起之次第一四六涅槃論其次涅槃稱為出世間依四道智而作證者為道果之所緣放棄所謂瓦那之渴愛故言為涅槃若由自性為一種若由原因之異門為有餘依涅槃界及無餘依涅槃界二種若由行相之差別者是空無相無願之三種一五脫瓦那諸大仙宣説無死究竟無為無上之句為涅槃如斯如來宣説心心所色涅槃四種第一義此於攝阿毗達磨義論名為攝色分別第六品七攝集分別一七十二種是基法言為有相我今適宜説其等基法之集二集之攝當知是攝不善攝雜攝菩提分攝一切之四種何以故一先述攝不善之四漏欲漏有漏見漏無明漏四暴流欲流有流見流無明流四軛欲軛有軛見軛無明軛四繫貪欲身繫瞋恚身繫戒禁取身繫此實在著身繫四取欲取見取戒禁取我語取六蓋欲貪蓋瞋恚蓋惛沈睡眠蓋掉舉惡作蓋疑蓋無明蓋七隨眠欲貪隨眠有貪隨眠瞋恚隨眠慢隨眠見隨眠疑隨眠無明隨眠十結於經中有欲貪結色貪結無色貪結瞋結慢結見結戒禁取結疑結掉舉結無明結在論中另有十結欲貪結有欲結瞋恚結慢結見結戒禁取結疑結嫉結慳結無明結十煩惱貪瞋癡慢見疑惛沈掉舉無慚無愧而此中於漏等依欲有之名以此為基渴愛之意義戒禁取此實住著我語取如斯轉起言不外是惡見三漏暴流軛繫依基自性為貪見無明之三取是説貪見之二蓋應為八隨眠為六結為九煩惱言十此九種是惡之攝四二攝雜有六因貪瞋癡無貪無瞋無癡七禪支尋伺喜一境性喜憂捨十二道支正見正思惟正語正業正命正精進正念正定邪見邪思惟邪精進邪定二十二根眼根耳根鼻根舌根身根女根男根命根意根樂根苦根喜根憂根捨根信根精進根念根定根慧根未知當知根已知根具知根九力信力精進力念力定力慧力慚力愧力無慚力無愧力四增上欲增上心增上精進增上觀增上四食段食第二觸食第三意思食第四識食而於此中於二十二根言須陀洹道智是未知當知根阿羅漢果是具知根中之六智是已知根又於命根有色非色之二種於前五識不得禪支無精進中不得諸力於無因中不得道支同樣於疑心中無有一境性定道支定根定力之狀態從二因三因之速行中其發生得隨一之增上五若依基自性因六禪支五道支九根法十六力法言九增上言四食亦同四斯七種善等之雜合言為雜之攝六三攝菩提分中有四念處身隨觀念處受隨觀念處心隨觀念處法隨觀念處有四正勤已起諸惡令捨斷之精進未起諸惡令不起之精進未起諸善令生起之精進已起諸善令增大之精進四神足欲神足心神足精進神足觀神足五根信根精進根念根定根慧根五力信力精進力念力定力慧力七覺支念覺支擇法覺支精進覺支喜覺支輕安覺支定覺支捨覺支八道支正見正思惟正語正業正命正精進正念正定而於邐中四念處言為一正念同樣四正勤可言一正精進七若依自性欲心捨信輕安喜正見思惟精住三離正念及禪定此等十四其中其中分別三十七總攝者便成七種思惟輕安喜捨欲心三離九各一處精進有九念八處定有四慧有五處信二處此三七法為最勝最上分別出世間總三十七但有時無思惟喜世間戒等六清淨於轉起時適合存八四攝一切有五色蘊受蘊想蘊行蘊識蘊五取蘊色取蘊受取蘊想取蘊行取蘊識取蘊十二處眼處耳處鼻處舌處身處意處色處聲處香處味處觸處法處十八界眼界耳界鼻界舌界身界意界色界聲界香界味界觸界法界眼識界耳識界鼻識界舌識界身識界意識界有四諦苦聖諦苦集聖諦苦集滅聖諦苦滅道聖諦而此中五十二心所十六細色與涅槃之六十九法稱為法處法界意處分別為七識界九色受乃至想及餘諸心所識之此等五而説為五蘊五取蘊亦然其等屬三界無分之涅槃免除蘊之攝門及所緣別而有十二處門所緣生起異門十八處三地之輪回集是苦渴愛涅槃名為滅與此出世間之相應法道及果亦是道如斯攝一切不出四聖諦宣説五種別此於攝阿毗達磨義論名為攝集分別第七品八攝緣分別一一切有為法以為何法緣今如其適宜我當分別説二緣之攝當有緣起法及發趣法二種其中緣起法是言觀察此有故彼有此無故彼無唯性質之行相其次發趣關於説差別而轉起緣及住立然諸阿闍梨混合緣起法與發趣法之兩者為論注一緣起法其中無明緣行行緣識識緣名色名色緣六處六處緣觸觸緣受受緣渴愛渴愛緣取取緣有有緣生生緣老死而發生愁悲苦憂惱如是此一切為苦滅之集此是緣攝中之緣起法三其中當知三時十二支二十行相三連結四略三輪轉二根本何以故無明行是過去時生老死是未來時中八是現在時此為三時無明行識名色六處觸受有生老死此為十二支而此時愁等之語以示等流果而非別支其次此緣起支中由無明行之語亦含攝愛取有之意義於同説愛取有而含有無明行之意義又言生老死有識等五果之意義故四過去之因五現在有五果現在因之五未來成五果五此是二十行相三連結四略無明愛取是煩惱輪轉所稱業有有之一部分與行為業輪轉稱為起有有之一部分與餘之七支為異熟輪轉此為三輪轉當知無明與愛為二根本六彼等根本滅由此輪轉滅老死之昏迷人人所逼惱數數諸漏生無明益增大斯無始連相輪轉於三地三界是故大牟尼施設緣起法七二發趣法發趣法者是二十四緣於因緣所緣緣增上緣無間緣等無間緣俱生緣互相緣依緣親依緣前生緣後生緣習行緣業緣異熟緣食緣根緣禪緣道緣相應緣不相應緣有緣非有緣離去緣不離去緣此是緣攝中之發趣法八一名對於名緣六種二對於名色緣五種三更對色只緣一種四色對於名亦唯一五施設與名色對名亦緣二六名色之二對名色之二緣九種如是成為六種緣九一於前滅之心心所法對於現在之心心所法是依無間等無間非有離去緣為緣前速行對於後速行是依習行緣為緣俱生之心心所法互相依相應緣為緣此是名對於名為六種緣二因禪支道支對於俱生之名色依因緣禪緣道緣等為緣俱生之思對於俱生之名色依業緣為緣多剎那之思對於依業生起之名色而依業緣為緣異熟蘊對於互相及俱生之色而依異熟緣為緣此是名對於名色之五種緣三後世之心心所法對於前生之此身而依後生緣為緣如斯名對於色唯一種緣四六基於轉起對於七識界是依前生緣為緣又五所緣對五識路是依前生緣為緣如斯色對於名亦一種緣五施設名色對於名是依所緣緣親依緣之二種緣其所緣緣親依緣之中所緣是色等而為六種親依是所緣親依無間親依自然親依之三種其中不重所緣是為所緣親依於無間前滅之心心所法是無間親依又貪等之法信等樂苦人食物時節臥坐具於適合對內外善等之法而為自然親依又業對於異熟為自然親依如斯自然親依有多種一六名色對於名色於適宜依增上俱生互相依食根不相應有不離去緣之九種緣其中一所尊重之所緣對於名而依所緣增上為增上緣俱生俱增上之四種亦對俱生之名色依俱生增上為增上緣有斯二種之增上緣二心心所法互相及對於俱生之色為俱生緣大種是互相及對所造色為俱生緣於結生剎那之基色與異熟心心所於互相為俱生緣有斯三種之俱生緣三心心所法於互相為互相緣大種於互相為互相緣於結生剎那之基色與異熟心心所於互相為互相緣有斯三種之互相緣四心心所法互相及對俱生色而為依緣大種互相及對所造色而為依緣六基對於七識界為依緣有斯三種之依緣五段食對此身為食緣非色食對於俱生之名色為食緣有斯二種之食緣六五淨根對於五識為根緣色命根對執受色為根緣非色命根對俱生之名色為根緣有斯三種之根緣七於下生結生剎那之基色對於異熟心心所依俱生為不相應緣心心所法對俱生色而依俱生為不相應緣後生之心心所法對前生之此身體而依後生為不相應緣於轉起六基對七識界而依前生為不相應緣有斯三種之不相應緣一一八九普俱生前生後生段食色命之此五種為有緣及不離緣一二其次於所緣緣親依緣業緣有緣之四緣中包含一切之二十四緣其次於此俱生色在一切轉起中有心等起色於結生中有已作業作色當知如斯有二種一三如斯由發生過去未來現在之三時及涅槃施設之離時內外與有為及無為諸法為施設假法名色之三而住立於此發趣論一切為二十四緣一四三施設其中色蘊是色法稱為心心所之四非色蘊與涅槃之五種是非色亦言為名其名色以外者為施設假法於施設有能施設之施設及所施設之施設之二種何以故一各各依大種之變化行相而各各施設地山等依資料材料之集合行相而施設家車荷車等依五蘊而施設男人等依日月之運行等而施設方時等依不觸之行相而施設坑窟等依各各大種相及特殊之修習而施設遍之相等而如斯類之物雖不存在第一義但第一義之影行相為心起心之所緣又此各作自比較於各別計度而施設命名號稱言説故而言為施設此施設言為施設所施設二其次施設能施設是依名名業等之名而説其為存在施設非存在施設存在非存在施設非存在存在施設存在存在施設非存在非存在施設之六種而此中於第一義以存在之色受等依此而施設時言此為存在施設其次於第一義以不存在之土地山等依此而施設時言此為非存在施設其次依兩者之混合其餘當知如次第之六神通存在非存在施設女聲非存在存在施設眼識存在存在施設王子非存在非存在施設一五隨順於語音依於耳識路無間轉起後生起意門境隨順其施設然後知其義意門當知彼施設世間世俗法此於攝阿毗達磨義論名為攝分別第八品九攝業處分別一此後修習止與觀二種我當説如次第之業處二其中先述止之攝是十遍處十不淨十隨念四無量一想一差別四無色之七種為止業處攝貪行者瞋行者癡行者信行者覺行者尋行者之六種行者性格者攝當知有遍作修習近行修習安止修習之三種修習及遍作相取相似相之三相何以故一四十業處地遍水遍火遍風遍青遍黃遍赤遍白遍虛空遍光明遍此名為十遍膨脹相青瘀相膿爛相斷壞相食殘相散亂相斬斫離散相血塗相蟲聚相骸骨相此名為十不淨佛隨念法隨念僧隨念戒隨念捨隨念天隨念寂止隨念死隨念身至念安般念此名為十隨念慈悲喜捨此名為四無量亦言為四梵住食厭想名為一想四界差別名為一差別空無邊處等名為四無色如斯解遍止者為四十業處二六行者與四十業處之適不適其次於六行者稱為貪行者適合修十不淨及身至念之身體四十二部分修習瞋行者適合修四無量及青等之四遍癡行者與尋行者適合安般念信行者適合佛隨念等之六覺行者適合死隨念寂止隨念食厭想界差別其餘一切之業處適合一一之行者性格者其中又於遍或大之遍適合癡行者小遍適合尋行者此是業處中適不適之差別三三三修習其次於三修習遍作修習於一切四十業處中皆必得近行修習於佛隨念等八食厭想四界差別之十業處中亦可成就安止修習在此十業處中沒有而餘在正三十業處中不僅可遍作修習近行修習且亦能成就安止修習在此三十業處中十遍安般念是屬於第五禪十不淨與身至念是屬於初禪慈等之三是屬於下四禪捨屬第五禪斯以上二十六業處是屬色界禪又四無色是屬無色禪此是業處中修習之差別四四三相其次於三相若依遍作相取相者於一切四十業處中皆適宜必得其次似相唯於十遍十不淨部分身至念安般念之二十二業處可得不論如何在其處二十二業處緣似相而轉起近行定及安止定何以故謂於地曼陀羅等把取其相初學者之彼所緣言為遍作相又此修習名為遍作修習其次此相更由心把取由眼見者之來現於意門時同其所緣名為取相其修習即能等持其次如斯等持者於此後緣取相依遍作定而繼續修習者如是類似於取相以離基所依法及稱為施設修習所成之所緣建立於心中而善安止之時此言為生起似相由此以來捨離障礙可稱為欲界定名為圓滿近行修習然後以其同似相依近行定善修習者即安止色界初禪其後從初禪轉向自在入定自在在定自在出定自在觀察自在由此五自在而使自在訓熟而捨離尋等之粗支為生起伺等之細支而努力者於次第適合安止於第二禪等如斯於地遍等之二十二學處可得似相又餘之十八業處中四無量對於有情施設而轉起其次除虛空遍并在九遍中除棄任何之遍以所得虛空而行遍作無邊者證初無色業處之安止其初無色識行遍作無邊者證得第二無色業處安止又其初無色識之無而行遍作無所有者證得第三無色業處安止第三無色而行遍作此是寂此是勝者證得第四無色業處安止而於餘之佛隨念等之十四業處緣遍作佛德等之所緣能把握其相時對此而遍作定可等持而成近行定其次以神通轉起於色界第五禪為神通立足處由第五禪定而豫想顧念神通之期間決定等之後行遍作修習者緣色等之所緣而適宜於安止而神通是五神變天耳他心知宿住隨念天眼之五種此是境之差別及止業處法畢六其次觀之業處當知攝戒清淨心清淨見清淨度疑清淨道非道智見清淨行道智見清淨智見清淨之七種清淨無常相苦相無我相之三相無常隨觀苦隨觀無我隨觀之三觀思惟智生滅智壞智怖畏智過患智厭智脫欲智省察智行捨智隨順智之十觀智空解脫無相解脫無願解脫之三解脫空隨觀無相隨觀無願隨觀之三解脫門何以故五七種清淨一別解脫律儀戒根律儀戒活命遍淨戒資具依戒之四遍淨戒言為戒清淨二近行定安止定之二種定言為心清淨三由相特相味作用現起現狀足處直接因而把握名色言為見清淨四把其等名色之緣言為度疑清淨五其次之後如斯把握有過去等之差別於有緣之三界諸行緣蘊等之理趣而由聚簡略之由其等之盡滅義而無常由怖畏義而苦由不堅實義而無我即思惟以上三相又依於三世依於一期相續又依剎那滅以諸行之思惟智而思惟無常苦無我之三相者又於其等諸行依於緣與剎那以生滅智隨觀生滅者七言為光明喜輕安勝解策勵樂智起捨欲八由把握光明等十觀隨染之障礙而差別道非道之相此言為道非道智見清淨六又其次脫離斯障礙而生滅智以來至隨順智止展轉無常苦無我三相之觀繼續行道彼瑜伽者之九觀智言為行道智見清淨七其次斯行道彼瑜伽者由觀之成熟今生起安止定以斷有分而生起意門轉向心之後二三剎那之觀心緣無常等任何之彼相名為遍作近行隨順之下轉起以到頂點之觀此言為隨順觀行捨觀至出起觀然後種姓心所緣涅槃超克凡夫之姓得成聖者之姓而轉起其後遍知苦諦捨斷集諦作證滅諦修習道諦入於聖道心之安止路其後轉起二三剎那之果心而滅然後墮於有分更斷有分而如次轉起觀察智九賢者觀察道果涅槃已斷煩惱及觀察殘餘未斷之煩惱或不觀察如斯經過六清淨之順觀應最後修習此須陀洹道等之四種道言為智見清淨此是觀業處中清淨之差別一六三解脫門其中無我隨觀以脫離我住著故言空隨觀為解脫門無常隨觀以脫離顛倒相故言無相隨觀為解脫門苦隨觀以脫離渴愛之願求故言無願隨觀為解脫門故若至觀出起而觀無我者此言為空解脫道若觀無常者此言為無相解脫道若觀苦者此言無願解脫道斯道由觀之道程而得此三名稱同樣果亦在道心之路中由道之道程而得空無相無願之三種名又在果定心之路中依上述之方法而修觀生起其各自之果由某人之觀的道程言為空等之解脫而依涅槃所緣由自味自相而在道之路果定之路一切處而相等道果之一切而有三種名此是觀業處中解脫之差別一一七人之別其次修習須陀洹道已依見疑之捨斷而捨斷惡趣行者極七還最高七次生此世間者而名為須陀洹預流修習斯陀含道已淡薄貪瞋癡者名為斯陀含一來彼唯再一次來此世間修習阿那含已捨斷而無殘留之欲貪瞋恚者名為阿那含不還彼不還來此世間修習阿羅漢已捨斷而無殘留之一切煩惱者名為阿羅漢彼漏盡者為世間最上之應供者此是觀業處中人之差別一二八定之差別其次果定是隨各自之果而得共通於一切者然得入定於滅定是阿那含與阿羅漢其定中如次第入定初禪等之大上二界定而出定在其處觀各處諸行之法而至無所有處止然後在定期間之決定等行多所作而入定於非想非非想處於二剎那安止速行之後彼心之相續斷絶此為入滅定者其次出定之時阿那含即一次轉起阿那含果心阿羅漢一次轉起阿羅漢果心而隨有分然後轉起觀察智此是觀業處中定之差別一三而於佛教冀求行道之樂味者應修習最上止觀之二修習此於攝阿毗達磨義論名攝業處分別第九品攝阿毗達磨義論畢
